name: Triển khai VietBid

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vietbid-production
  cancel-in-progress: false

jobs:
  build-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Cài thư viện
        run: |
          npm --prefix backend ci --no-audit --no-fund
          npm --prefix frontend ci --no-audit --no-fund

      - name: Kiểm tra backend và công cụ triển khai
        run: |
          npm --prefix backend run check
          npm --prefix backend test
          python3 -m unittest discover -s deploy/tests -v

      - name: Kiểm tra và build giao diện
        env:
          VITE_API_URL: /api
          VITE_CHE_DO_KIEM_THU: 'false'
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend test
          npm --prefix frontend run build

      - name: Đóng gói bản Linux
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_RUN: ${{ github.run_id }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
        run: |
          npm --prefix backend prune --omit=dev --no-audit --no-fund
          python3 deploy/phat_hanh.py pack --sha "$RELEASE_SHA" --run-id "$RELEASE_RUN" --attempt "$RELEASE_ATTEMPT" --output "$RUNNER_TEMP/vietbid-release.tar.gz"

      - name: Kiểm tra khóa triển khai
        id: access
        env:
          DEPLOY_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
        run: |
          if [ -n "$DEPLOY_KEY" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Build đã đạt. Chưa triển khai vì cần cấu hình ALWAYSDATA_SSH_KEY và cài bộ nhận trên hosting.'
            echo 'Chưa triển khai: cần cấu hình ALWAYSDATA_SSH_KEY và bootstrap hosting.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Đưa bản mới lên alwaysdata
        if: steps.access.outputs.ready == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/vietbid-deploy-key"
          trap 'rm -f "$RUNNER_TEMP/vietbid-deploy-key"' EXIT
          ssh -T -i "$RUNNER_TEMP/vietbid-deploy-key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=deploy/alwaysdata_known_hosts \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            vietbid@ssh-vietbid.alwaysdata.net \
            'python3 vietbid/deploy/phat_hanh.py receive' < "$RUNNER_TEMP/vietbid-release.tar.gz"

      - name: Kiểm tra phiên bản và WebSocket công khai
        if: steps.access.outputs.ready == 'true'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node deploy/kiem-tra-web.cjs
